name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check the signing secret
        id: secret
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "::warning::The KEYSTORE_PASSPHRASE secret isn't set yet, so this build is checked but not published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the page
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Unlock the signing key
        if: steps.secret.outputs.signed == 'true'
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/app/signing/slabplates.p12.enc \
            -out android/app/signing/slabplates.p12 \
            -pass env:KEYSTORE_PASSPHRASE

      - name: Build the app
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_STORE_FILE: ${{ steps.secret.outputs.signed == 'true' && 'signing/slabplates.p12' || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
          SIGNING_KEY_ALIAS: slabplates
          SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSPHRASE }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_RUNAME: ${{ secrets.EBAY_RUNAME }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle.log
          if [ -n "$EBAY_CLIENT_ID" ] && [ -n "$EBAY_CLIENT_SECRET" ] && [ -n "$EBAY_RUNAME" ]; then
            echo "::notice::eBay keys included"
          else
            echo "::notice::eBay keys not set, so the eBay panel will say it isn't set up"
          fi

      - name: Report build errors
        if: failure()
        working-directory: android
        run: |
          if [ -f gradle.log ]; then
            msg=$(grep -E "error:|warning: \[|What went wrong|e: |FAILED|Exception" -A2 gradle.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle::${msg}"
          fi

      - name: Publish the download
        if: steps.secret.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="SlabPlates-1.0.${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "v1.0.${{ github.run_number }}" "$APK" \
            --title "Slab Plates 1.0.${{ github.run_number }}" \
            --notes "On your phone, download $APK below and open it to install or update. The version number shows at the top of the app. Built from ${{ github.sha }}." \
            --latest
