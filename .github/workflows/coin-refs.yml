name: Fetch coin type references

on:
  push:
    branches: [coin-refs]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Download the listed Commons photos
        run: python3 tools/commons_fetch.py > fetch-summary.txt 2>fetch-errors.txt || true
      - name: Encrypt for the requester and commit to this branch
        run: |
          mkdir -p img out && zip -qr refs.zip img
          openssl rand -out key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in refs.zip -out img.zip.enc -pass file:key.bin && split -b 40m img.zip.enc out/img.zip.enc.part- && ls -la out
          openssl pkeyutl -encrypt -pubin -inkey tools/fetch.pub -in key.bin -out out/img.key.enc
          cp fetch-summary.txt fetch-errors.txt out/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add out && git commit -qm "Commons photos (encrypted) [skip ci]" && git push -q
