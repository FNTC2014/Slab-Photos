name: Fetch coin type references

on:
  push:
    branches: [coin-refs]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: List Canadian coin photos on Wikimedia Commons
        run: |
          mkdir -p out
          python3 tools/commons_list.py "Category:Coins of Canada" 2>out/list-errors.txt | tee out/list-summary.txt
      - name: Commit the list
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add out && git commit -qm "Commons file list [skip ci]" && git push -q
